name: App de escritorio

# Compila la app WPF en un runner de Windows y deja el .exe descargable como
# artefacto de la ejecucion.
on:
  push:
    branches: [main]
    paths:
      - 'escritorio/**'
      - '!escritorio/LEEME.md'
      - '.github/workflows/escritorio.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar
        run: dotnet publish escritorio/Trazos.csproj -c Release -o salida

      - uses: actions/upload-artifact@v4
        with:
          name: Trazos-windows-x64
          path: salida/Trazos.exe
          if-no-files-found: error
