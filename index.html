<style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
        }
        
        .sidebar {
            width: 160px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 100vh;
        }
        
        .nav-item {
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .nav-item.active {
            background: rgba(0, 123, 255, 0.8);
            box-shadow: 0 2px 10px rgba(0, 123, 255, 0.3);
        }
        
        /* Reducir tamaños de fuente y padding globalmente */
        .content-area {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            min-height: 100vh;
            max-width: 80%;
            font-size: 0.875rem; /* Reducir texto base de 1rem a 0.875rem */
        }
        
        .content-area h1 {
            font-size: 2rem; /* Reducir de ~2.5rem a 2rem */
        }
        
        .content-area h3 {
            font-size: 1.5rem; /* Reducir de ~1.75rem a 1.5rem */
        }
        
        .content-area h5 {
            font-size: 1.125rem; /* Reducir de ~1.25rem a 1.125rem */
        }
        
        .content-area .lead {
            font-size: 1.125rem; /* Reducir de ~1.25rem a 1.125rem */
        }
        
        .content-area .fs-4 {
            font-size: 1.25rem; /* Reducir de ~1.5rem a 1.25rem */
        }
        
        @media (max-width: 991px) {
            .content-area {
                max-width: 100%;
                font-size: 1rem; /* Mantener tamaño normal en mobile */
            }
            
            .content-area h1 { font-size: 2.5rem; }
            .content-area h3 { font-size: 1.75rem; }
            .content-area h5 { font-size: 1.25rem; }
            .content-area .lead { font-size: 1.25rem; }
            .content-area .fs-4 { font-size: 1.5rem; }
        }
        
        .video-column {
            width: 0;
            opacity: 0;
            transition: all 0.3s ease;
            background: #000;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .video-column.show {
            width: calc(100vh * 9 / 16);
            opacity: 1;
        }
        
        .video-player {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        
        .video-controls {
            display: flex;
            gap: 8px;
        }
        
        .close-video, .mute-video {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            transition: background-color 0.3s ease;
        }
        
        .close-video:hover, .mute-video:hover {
            background: rgba(0, 0, 0, 0.9);
            color: white;
        }
        
        .mute-video.muted {
            background: rgba(220, 53, 69, 0.8);
        }
        
        /* Cards mejoradas */
        .feature-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        /* Videos aún no disponibles -> tarjeta deshabilitada */
        .feature-card.no-video { cursor: default; }
        .feature-card.no-video:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .feature-card.no-video .fa-play-circle { display: none; }
        .feature-card.no-video::after {
            content: 'Próximamente';
            position: absolute; top: 8px; right: 8px;
            font-size: 10px; color: #cfd6e4;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 9px; border-radius: 10px;
        }
        .feature-card.is-youtube .fa-play-circle { color: #ff3b30; }
        /* Badge de versión */
        .version-badge {
            position: fixed; bottom: 8px; right: 12px;
            font-size: 10px; color: rgba(255, 255, 255, 0.4);
            letter-spacing: .5px; pointer-events: none; user-select: none; z-index: 1500;
        }
        /* Toast */
        #toast {
            position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
            background: rgba(20, 20, 20, 0.95); color: #fff;
            padding: 11px 20px; border-radius: 24px; font-size: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .feature-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .highlight {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Subsecciones (usadas dentro de Hardware) */
        .subsection-title {
            font-size: 1.4rem;
            margin: 2.5rem 0 1.25rem;
            padding: .35rem 0 .35rem .75rem;
            border-left: 4px solid #007bff;
            color: #fff;
        }
        .subsection-title:first-of-type {
            margin-top: 1rem;
        }
        .tech-label { color: rgba(255, 255, 255, 0.6); }

        /* Tabs de Hardware (pills horizontales, scrollables en mobile) */
        .hw-tabs {
            gap: .5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: .75rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .hw-tabs .nav-link {
            color: rgba(255, 255, 255, 0.75);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .hw-tabs .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .hw-tabs .nav-link.active {
            background: rgba(0, 123, 255, 0.85);
            border-color: transparent;
            color: #fff;
        }

        /* Lightbox grande para videos de YouTube (16:9) */
        .yt-lightbox {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 4000;
            display: none;
            align-items: center; justify-content: center;
            padding: 4vh 4vw;
        }
        .yt-lightbox.show { display: flex; }
        .yt-frame {
            position: relative;
            width: min(94vw, 1400px);
            aspect-ratio: 16 / 9;
            max-height: 90vh;
        }
        .yt-frame iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: 0; border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .yt-lightbox-close {
            position: absolute;
            top: 18px; right: 24px;
            display: flex; align-items: center; gap: 8px;
            height: 56px; padding: 0 22px 0 18px;
            border: none; border-radius: 28px;
            background: #dc3545; color: #fff;
            font-size: 18px; font-weight: 700;
            cursor: pointer; z-index: 4001;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: background 0.15s, transform 0.1s;
        }
        .yt-lightbox-close:hover { background: #b02a37; }
        .yt-lightbox-close:active { transform: scale(0.96); }
        .yt-lightbox-close i { font-size: 22px; }
        @media (max-width: 767px) {
            .yt-lightbox-close { top: 10px; right: 12px; height: 48px; padding: 0 16px; font-size: 15px; }
        }
        
        /* Mobile: Menu superior */
        @media (max-width: 767px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                height: 70px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .nav-item {
                min-width: 50px;
                flex: 0 0 auto;
            }
            
            .nav-text {
                display: none;
            }
            
            .nav-item i {
                font-size: 1rem;
                margin-bottom: 0;
            }
            
            .video-column.show {
                width: 100%;
                height: 70vh;
            }
            
            .content-area {
                min-height: auto;
            }
        }
        
        /* Tablet: Iconos con texto inline */
        @media (min-width: 768px) and (max-width: 991px) {
            .sidebar {
                width: 120px;
            }
            
            .nav-item {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                text-align: left;
                padding: 8px 12px;
            }
            
            .nav-item i {
                font-size: 1rem;
                margin-right: 8px;
                margin-bottom: 0;
                width: 16px;
            }
            
            .nav-text {
                font-size: 11px;
                line-height: 1.2;
            }
        }
    </style>
</head>

<script>
        // Elementos principales
        const contentArea = document.getElementById('content-area');
        const videoColumn = document.getElementById('video-column');
        const videoPlayer = document.getElementById('video-player');
        const videoSource = document.getElementById('video-source');
        const closeVideoBtn = document.getElementById('close-video');
        const muteVideoBtn = document.getElementById('mute-video');
        
        // Modal elements
        const modalVideoPlayer = document.getElementById('modal-video-player');
        const modalVideoSource = document.getElementById('modal-video-source');
        
        // Páginas disponibles - ahora cargarán desde archivos externos
        async function loadPage(pageName) {
            try {
                contentArea.innerHTML = `
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="text-center">
                            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                            <br>
                            <span class="text-light">Cargando ${pageName}...</span>
                        </div>
                    </div>
                `;
                
                const response = await fetch(`${pageName}.html?v=${Date.now()}`, { cache: 'reload' });
                if (response.ok) {
                    const content = await response.text();
                    contentArea.innerHTML = content;
                    attachVideoListeners();
                    refreshEmbeds();
                } else {
                    throw new Error('Página no encontrada');
                }
            } catch (error) {
                contentArea.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3 text-warning"></i>
                        <h3>Página en construcción</h3>
                        <p class="text-light">La página "${pageName}" estará disponible próximamente.</p>
                    </div>
                `;
            }
        }
        
        // Detecta un ID de YouTube en una URL (youtu.be, watch?v=, embed, shorts)
        function getYouTubeId(url) {
            if (!url) return null;
            const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : null;
        }
        function ytEmbed(id) { return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`; }

        // YouTube (16:9) -> lightbox grande centrado
        const ytLightbox = document.getElementById('yt-lightbox');
        const ytFrame = document.getElementById('yt-frame');
        function openYtLightbox(id) {
            ytFrame.innerHTML = '<iframe src="' + ytEmbed(id) + '" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
            ytLightbox.classList.add('show');
        }
        function closeYtLightbox() {
            ytLightbox.classList.remove('show');
            ytFrame.innerHTML = '';
        }

        // Toast breve (p. ej. "Video próximamente")
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._h);
            t._h = setTimeout(() => t.classList.remove('show'), 2400);
        }

        // Manejo de videos (solo se llama desde cards con video real)
        function playVideo(videoPath) {
            const ytId = getYouTubeId(videoPath);
            if (ytId) { openYtLightbox(ytId); return; }   // YouTube -> lightbox
            playMp4(videoPath.includes('videos/') ? videoPath : `videos/${videoPath}`);
        }

        // Reproduce un .mp4 en la columna lateral (desktop) o el modal (mobile)
        function playMp4(fullVideoPath) {
            if (window.innerWidth <= 767) {
                modalVideoSource.src = fullVideoPath;
                modalVideoPlayer.load();
                const modal = new bootstrap.Modal(document.getElementById('videoModal'));
                modal.show();
            } else {
                videoSource.src = fullVideoPath;
                videoPlayer.load();
                videoColumn.classList.add('show');
                videoPlayer.play().catch(e => console.log('Autoplay blocked'));
            }
        }

        // Cerrar video (columna lateral mp4)
        function closeVideo() {
            videoColumn.classList.remove('show');
            videoPlayer.pause();
            videoSource.src = '';
            // Reset mute button when closing
            videoPlayer.muted = true;
            updateMuteButton();
        }
        
        // Mute/unmute video
        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            updateMuteButton();
        }
        
        // Update mute button appearance
        function updateMuteButton() {
            const icon = muteVideoBtn.querySelector('i');
            if (videoPlayer.muted) {
                icon.className = 'fas fa-volume-mute';
                muteVideoBtn.classList.add('muted');
                muteVideoBtn.title = 'Activar sonido';
            } else {
                icon.className = 'fas fa-volume-up';
                muteVideoBtn.classList.remove('muted');
                muteVideoBtn.title = 'Silenciar';
            }
        }
        
        // Attach listeners a cards de video.
        // Solo se habilitan los que tienen video real (YouTube o .mp4 existente);
        // los .mp4 que aún no existen quedan deshabilitados ("Próximamente").
        function attachVideoListeners() {
            document.querySelectorAll('[data-video]').forEach(card => {
                const videoPath = card.getAttribute('data-video');
                if (!videoPath) return;
                if (getYouTubeId(videoPath)) {
                    card.classList.add('has-video', 'is-youtube');
                    card.addEventListener('click', () => playVideo(videoPath));
                } else {
                    const full = videoPath.includes('videos/') ? videoPath : `videos/${videoPath}`;
                    fetch(full, { method: 'HEAD' }).then(r => {
                        if (r.ok) {
                            card.classList.add('has-video');
                            card.addEventListener('click', () => playVideo(videoPath));
                        } else {
                            card.classList.add('no-video');   // deshabilitado, sin click
                        }
                    }).catch(() => card.classList.add('no-video'));
                }
            });
        }

        // Carga los iframes embebidos (menu/, dms/) siempre frescos, sin caché
        function refreshEmbeds() {
            document.querySelectorAll('iframe[data-src]').forEach(f => {
                const base = f.getAttribute('data-src');
                f.src = base + (base.includes('?') ? '&' : '?') + 't=' + Date.now();
            });
        }

        // Navegación del sidebar -> cambia el hash (deep-link por sección)
        document.querySelectorAll('.nav-item[data-page]').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.getAttribute('data-page');
                if (('#' + page) === location.hash) { handleHash(); }  // reabrir misma sección
                else { location.hash = page; }
            });
        });

        // Marca activa + carga según el hash (#hardware, #gestion, ...)
        function handleHash() {
            let page = (location.hash || '#home').slice(1);
            if (!document.querySelector('[data-page="' + page + '"]')) page = 'home';
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.querySelectorAll('[data-page="' + page + '"]').forEach(nav => nav.classList.add('active'));
            loadPage(page);
        }
        window.addEventListener('hashchange', handleHash);
        
        // Cerrar video
        closeVideoBtn.addEventListener('click', closeVideo);
        
        // Mute/unmute video
        muteVideoBtn.addEventListener('click', toggleMute);

        // Al cerrar el modal: detener el video mp4
        document.getElementById('videoModal').addEventListener('hidden.bs.modal', function() {
            modalVideoPlayer.pause();
            modalVideoSource.src = '';
        });

        // Lightbox de YouTube: cerrar con el botón, clic en el fondo o Esc
        document.getElementById('yt-lightbox-close').addEventListener('click', closeYtLightbox);
        ytLightbox.addEventListener('click', function(e) {
            if (e.target === ytLightbox) closeYtLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && ytLightbox.classList.contains('show')) closeYtLightbox();
        });

        // Pantalla completa
        function setupFullscreen(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.addEventListener('click', function() {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                });
            }
        }
        
        setupFullscreen('fullscreen-toggle');
        setupFullscreen('fullscreen-toggle-tablet');
        setupFullscreen('fullscreen-toggle-mobile');
        
        // Initialize mute button state and load section from hash (deep-link)
        document.addEventListener('DOMContentLoaded', () => {
            updateMuteButton();
            handleHash();
        });
    </script>
</body>
</html>
