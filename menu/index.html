<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.9.16">
  <title>EDUBOARD - Panel Interactivo v1.9.16</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { cursor: none !important; }

    html, body { background: transparent; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    }

    #touch-cursor {
      position: fixed;
      width: 36px; height: 36px;
      border: 2.5px solid rgba(255,255,255,0.95);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      left: -300px; top: -300px;
      transform: translate(-50%, -50%);
      transition: border-color 0.12s, background-color 0.12s, box-shadow 0.12s, width 0.12s, height 0.12s;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.75), 0 2px 12px rgba(0,0,0,0.4);
    }
    #touch-cursor::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 5px; height: 5px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
      transition: background-color 0.12s;
    }
    #touch-cursor.tc-down {
      border-color: #ff6a00;
      background-color: rgba(255,106,0,0.22);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 18px rgba(255,106,0,0.7);
      width: 50px; height: 50px;
    }
    #touch-cursor.tc-down::after {
      background-color: #ff6a00;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    }

    .version-badge {
      position: fixed; bottom: 10px; right: 12px;
      font-size: 9px; color: rgba(0,0,0,0.25);
      letter-spacing: 0.8px; pointer-events: none; user-select: none;
    }

    .device-wrap {
      position: relative;
      width: min(960px, 96vw);
      border-radius: 10px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .device-img {
      width: 100%; height: auto; display: block;
      user-select: none; -webkit-user-drag: none;
    }

    .screen-area {
      position: absolute;
      left: 1.94%; top: 5.41%;
      width: 96.13%; height: 89.18%;
      overflow: hidden;
      z-index: 1;
    }

    body.debug .screen-area { outline: 3px dashed #2255ff; }
    body.debug .flow-hotspot {
      background: rgba(255,160,0,0.35) !important;
      outline: 2px dashed #ff6a00;
    }
    body.debug .flow-hotspot::after {
      content: attr(data-label);
      position: absolute; top: 3px; left: 5px;
      font-size: 9px; font-weight: 700; color: #ff3300;
      white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 3px white;
    }
    body.debug .config-hotspot { background: rgba(80,100,255,0.25) !important; outline: 2px dashed #4466ff; }

    .base-hotspot {
      position: absolute;
      background: transparent; border: none;
      z-index: 6;
      border-radius: 5px;
      transition: background 0.15s;
    }
    .base-hotspot:hover { background: rgba(255,255,255,0.12); }
    body.debug .base-hotspot {
      background: rgba(0,255,150,0.30) !important;
      outline: 2px dashed #00ff88;
    }
    body.debug .base-hotspot::after {
      content: attr(data-label);
      position: absolute; top: 3px; left: 5px;
      font-size: 9px; font-weight: 700; color: #00dd66;
      white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 3px white;
    }

    body.debug .flow-hotspot,
    body.debug .config-hotspot,
    body.debug .base-hotspot { cursor: none !important; }
    .hs-handle {
      position: absolute;
      width: 10px; height: 10px;
      background: #fff;
      border: 2px solid #ff6a00;
      border-radius: 2px;
      z-index: 50;
      pointer-events: auto;
      display: none;
    }
    body.debug .hs-handle { display: block; }
    .hs-handle.nw { top:-5px; left:-5px; }
    .hs-handle.ne { top:-5px; right:-5px; }
    .hs-handle.sw { bottom:-5px; left:-5px; }
    .hs-handle.se { bottom:-5px; right:-5px; }
    .hs-handle.n  { top:-5px; left:calc(50% - 5px); }
    .hs-handle.s  { bottom:-5px; left:calc(50% - 5px); }
    .hs-handle.w  { top:calc(50% - 5px); left:-5px; }
    .hs-handle.e  { top:calc(50% - 5px); right:-5px; }

    /* ===== Overlay posicionable (campo PIN) ===== */
    .overlay-field {
      position: absolute;
      z-index: 32;
      pointer-events: none;
    }
    .pin-dots {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }
    .pdot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid rgba(0,0,0,0.30);
      flex-shrink: 0;
      transition: background 0.10s, border-color 0.10s;
    }
    .pdot.filled { background: #111; border-color: #111; }
    body.debug .overlay-field {
      pointer-events: auto;
      outline: 2px dashed #cc00ff;
      background: rgba(200,0,255,0.10);
    }
    body.debug .overlay-field::after {
      content: attr(data-label);
      position: absolute; top: 3px; left: 5px;
      font-size: 9px; font-weight: 700; color: #cc00ff;
      white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 3px white;
    }

    .debug-badge {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,20,0.92); color: #00ff88;
      font-size: 10px; font-weight: 700; padding: 5px 14px;
      border-radius: 10px; letter-spacing: 0.4px;
      pointer-events: none; display: none; z-index: 2000;
      font-family: monospace; white-space: nowrap;
    }
    body.debug .debug-badge { display: block; }

    #debug-panel {
      position: fixed;
      bottom: 16px; right: 16px;
      width: 510px;
      max-height: 60vh;
      background: rgba(8,8,8,0.96);
      border: 1px solid #00ff88;
      border-radius: 10px;
      font-family: monospace;
      z-index: 3000;
      display: none;
      flex-direction: column;
      box-shadow: 0 4px 28px rgba(0,0,0,0.7);
      overflow: hidden;
    }
    body.debug #debug-panel { display: flex; }
    #debug-panel-head {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      border-bottom: 1px solid #1a3a2a;
      flex-shrink: 0;
    }
    .dp-title { font-size: 11px; font-weight: 700; color: #00ff88; letter-spacing: 0.5px; flex: 1; }
    #debug-hover { font-size: 10px; color: #facc15; font-family: monospace; min-width: 130px; text-align: right; }
    #debug-copy-btn {
      font-size: 10px; font-weight: 700;
      background: #00ff88; color: #000;
      border: none; border-radius: 5px;
      padding: 4px 10px; flex-shrink: 0;
    }
    #debug-copy-btn:hover { background: #00dd66; }
    #debug-panel-rows { overflow-y: auto; flex: 1; padding: 4px 0; }
    .dp-row {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      border-bottom: 1px solid #0d1a0d;
      font-size: 10.5px; transition: background 0.1s;
    }
    .dp-row:hover { background: rgba(0,255,136,0.07); }
    .dp-row.dp-active { background: rgba(255,200,0,0.12) !important; }
    .dp-name { color: #facc15; font-weight: 700; min-width: 145px; max-width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dp-arrow { color: #333; flex-shrink: 0; }
    .dp-dest { color: #86efac; min-width: 90px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dp-coords { color: #999; flex: 1; white-space: nowrap; font-size: 10px; }

    #content-base {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block; object-fit: fill;
      z-index: 1;
    }

    .config-hotspot {
      position: absolute;
      left: 59.4%; top: 65.8%;
      width: 4.7%; height: 8.3%;
      background: transparent; border: none;
      border-radius: 16px;
      z-index: 5;
      transition: background 0.15s, transform 0.1s;
    }
    .config-hotspot:hover  { background: rgba(255,255,255,0.16); }
    .config-hotspot:active { transform: scale(0.95); }

    .error-overlay {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      z-index: 10; pointer-events: none;
    }
    .error-overlay.open { display: flex; }

    .error-dialog {
      pointer-events: all;
      background: #efefef;
      border-radius: 11px;
      width: 60%;
      overflow: hidden;
      box-shadow: 0 5px 28px rgba(0,0,0,0.30);
      animation: errPop 0.18s ease;
    }
    @keyframes errPop { from { transform:scale(0.9);opacity:0 } to { transform:scale(1);opacity:1 } }

    .error-dialog-title {
      padding: 26px 30px 21px;
      font-size: 17px; font-weight: 600;
      color: #2a2a2a; line-height: 1.35;
    }
    .error-dialog-item {
      display: flex; align-items: center; gap: 21px;
      padding: 18px 30px;
      font-size: 15px; color: #2a2a2a;
      border-top: 1px solid rgba(0,0,0,0.08);
      transition: background 0.13s; pointer-events: all;
    }
    .error-dialog-item:hover  { background: rgba(0,0,0,0.05); }
    .error-dialog-item:active { background: rgba(0,0,0,0.10); }
    .err-ico { width: 27px; height: 27px; flex-shrink: 0; }

    .screen-layer {
      position: absolute; inset: 0;
      display: none; z-index: 20;
      overflow: hidden;
    }
    .screen-layer.active { display: block; }
    .screen-layer .screen-img {
      width: 100%; height: 100%;
      display: block; object-fit: fill;
      position: absolute; inset: 0;
    }

    .scroll-content { position: absolute; left: 0; top: 0; width: 100%; }
    .scroll-img {
      width: 100%; height: auto; display: block;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
    }

    .flow-hotspot {
      position: absolute;
      background: transparent; border: none;
      z-index: 30; border-radius: 5px;
      transition: background 0.15s;
    }
    .flow-hotspot:hover  { background: rgba(255,255,255,0.14); }
    .flow-hotspot:active { background: rgba(255,255,255,0.24); }

    .error-trigger-btn {
      position: fixed; bottom: 34px; left: 18px;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 15px;
      background: #c62828; color: white;
      border: none; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      z-index: 1000;
      box-shadow: 0 3px 10px rgba(198,40,40,0.45);
      transition: background 0.15s, transform 0.1s;
    }
    .error-trigger-btn:hover  { background: #b71c1c; }
    .error-trigger-btn:active { transform: scale(0.96); }
    .error-trigger-btn svg { width: 13px; height: 13px; fill: white; }

    .lock-trigger-btn {
      position: fixed; bottom: 34px; left: 160px;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 15px;
      background: #1565c0; color: white;
      border: none; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      z-index: 1000;
      box-shadow: 0 3px 10px rgba(21,101,192,0.45);
      transition: background 0.15s, transform 0.1s;
    }
    .lock-trigger-btn:hover  { background: #0d47a1; }
    .lock-trigger-btn:active { transform: scale(0.96); }
    .lock-trigger-btn svg { width: 13px; height: 13px; fill: white; }

    .cfg-sidebar{width:230px;min-width:230px;background:#f4f3f6;border-right:1px solid #e2dfe8;display:flex;flex-direction:column;overflow:hidden}
    .cfg-sidebar-head{padding:14px 14px 8px;border-bottom:1px solid #e2dfe8}
    .cfg-sidebar-title{font-size:13px;font-weight:700;color:#222;display:flex;align-items:center;gap:7px}
    .cfg-sidebar-title svg{width:16px;height:16px;fill:#7c3aed;flex-shrink:0}
    .cfg-badge{font-size:8px;background:#7c3aed;color:white;padding:1px 5px;border-radius:3px;letter-spacing:.5px;font-weight:600}
    .cfg-search{width:100%;margin-top:8px;padding:6px 10px;border:1px solid #d0ccd8;border-radius:6px;font-size:11px;outline:none;background:white;color:#333}
    .cfg-search:focus{border-color:#7c3aed}
    .cfg-nav{flex:1;overflow-y:auto;padding:6px 0}
    .cfg-section-label{padding:8px 14px 3px;font-size:10px;font-weight:600;color:#999;letter-spacing:.8px;text-transform:uppercase}
    .cfg-nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12px;color:#444;transition:background .13s;border-radius:6px;margin:1px 6px}
    .cfg-nav-item:hover{background:#ede8f5}
    .cfg-nav-item.active{background:#ede8f5;color:#6d28d9;font-weight:600}
    .nav-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .nav-ico svg{width:14px;height:14px;fill:white}
    .cfg-content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
    .cfg-content-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid #f0eef4}
    .cfg-content-title{font-size:16px;font-weight:700;color:#1a1a2e}
    .cfg-close{width:26px;height:26px;border-radius:50%;border:none;background:#f0eef4;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;line-height:1;transition:background .13s}
    .cfg-close:hover{background:#ddd}
    .cfg-body{padding:18px 22px;flex:1}
    .info-table{border:1px solid #eae7f0;border-radius:8px;overflow:hidden}
    .info-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f0eef5;font-size:12px}
    .info-row:last-child{border-bottom:none}
    .info-key{flex:1;color:#3a3a4a}
    .info-val{color:#888}
    .info-val.link{color:#7c3aed}
    .cache-btn{display:block;width:100%;margin-top:22px;padding:11px;border:1.5px solid #8b5cf6;background:transparent;color:#7c3aed;border-radius:24px;font-size:12px;font-weight:500;transition:all .18s}
    .cache-btn:hover{background:#8b5cf6;color:white}
    .section-title{font-size:11px;font-weight:700;color:#444;margin:16px 0 8px;letter-spacing:.3px;text-transform:uppercase}
    .separator{height:1px;background:#f0eef5;margin:16px 0}
    .cfg-action-btn{padding:7px 16px;background:#7c3aed;color:white;border:none;border-radius:16px;font-size:11px;font-weight:500;transition:background .15s}
    .cfg-action-btn:hover{background:#6d28d9}
    .cfg-action-btn.outline{background:transparent;border:1.5px solid #7c3aed;color:#7c3aed}
    .cfg-action-btn.outline:hover{background:#ede8f5}
    .cfg-action-btn.danger{background:#ef4444}
    .cfg-action-btn.danger:hover{background:#dc2626}
    .cfg-action-btn.success{background:#22c55e}
    .cfg-action-btn.success:hover{background:#16a34a}
    .status-row{display:flex;align-items:center;gap:7px;font-size:11px;color:#555;margin-bottom:10px}
    .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .dot-green{background:#22c55e;box-shadow:0 0 0 2px #dcfce7}
    .dot-grey{background:#9ca3af;box-shadow:0 0 0 2px #f3f4f6}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border:1px solid #eae7f0;border-radius:8px;margin-bottom:8px}
    .toggle-info{flex:1}
    .toggle-label{font-size:12px;font-weight:500;color:#222}
    .toggle-desc{font-size:10px;color:#888;margin-top:2px}
    .toggle{position:relative;width:36px;height:20px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:20px;transition:background .2s}
    .toggle-slider::before{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;bottom:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .toggle input:checked+.toggle-slider{background:#7c3aed}
    .toggle input:checked+.toggle-slider::before{transform:translateX(16px)}
    .form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
    .form-label{font-size:10px;color:#666;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
    .form-input{padding:8px 11px;border:1px solid #d0ccd8;border-radius:6px;font-size:12px;outline:none;color:#333;background:white}
    .form-input:focus{border-color:#7c3aed}
    .form-input[readonly]{background:#f9f8fb;color:#666}
    .select-input{padding:8px 11px;border:1px solid #d0ccd8;border-radius:6px;font-size:12px;outline:none;color:#333;background:white;width:100%}
    .select-input:focus{border-color:#7c3aed}
    .form-row-inline{display:flex;gap:10px;margin-bottom:14px}
    .form-row-inline .form-row{flex:1;margin-bottom:0}
    .users-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .users-count{font-size:11px;color:#888}
    .user-card{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #eae7f0;border-radius:8px;margin-bottom:7px}
    .user-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:700;flex-shrink:0}
    .user-meta{flex:1}
    .user-name{font-size:12px;font-weight:600;color:#222}
    .user-sub{font-size:10px;color:#888;margin-top:2px}
    .user-badge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600}
    .badge-active{background:#d1fae5;color:#065f46}
    .badge-inactive{background:#f3f4f6;color:#6b7280}
    .user-actions{display:flex;gap:5px}
    .icon-btn{width:26px;height:26px;border-radius:50%;border:none;background:#f4f3f6;display:flex;align-items:center;justify-content:center;transition:background .13s}
    .icon-btn:hover{background:#e5e2f0}
    .icon-btn svg{width:13px;height:13px;fill:#7c3aed}
    .icon-btn.del:hover{background:#fee2e2}
    .icon-btn.del svg{fill:#ef4444}
    .network-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #eae7f0;border-radius:8px;transition:background .13s;margin-bottom:6px}
    .network-item:hover{background:#f9f8fb}
    .network-item.connected{border-color:#7c3aed;background:#faf8ff}
    .network-icon svg{width:16px;height:16px;fill:#999}
    .network-item.connected .network-icon svg{fill:#7c3aed}
    .network-meta{flex:1}
    .network-name{font-size:12px;font-weight:500;color:#222}
    .network-detail{font-size:10px;color:#888;margin-top:1px}
    .network-item.connected .network-name{color:#6d28d9;font-weight:600}
    .signal-bars{display:flex;gap:2px;align-items:flex-end}
    .bar{width:3px;background:#ddd;border-radius:1px}
    .bar.on{background:#7c3aed}
    .update-version-box{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f9f8fb;border:1px solid #eae7f0;border-radius:8px;margin-bottom:16px}
    .uv-label{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.4px}
    .uv-val{font-size:15px;font-weight:700;color:#1a1a2e;margin-top:2px}
    .uv-badge{background:#d1fae5;color:#065f46;font-size:9px;font-weight:600;padding:3px 9px;border-radius:10px}
    .history-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0eef5}
    .history-item:last-child{border-bottom:none}
    .history-dot{width:8px;height:8px;border-radius:50%;background:#7c3aed;margin-top:3px;flex-shrink:0}
    .history-ver{font-size:12px;font-weight:600;color:#222}
    .history-date{font-size:10px;color:#aaa;margin-top:2px}
    .history-note{font-size:10px;color:#666;margin-top:2px}
    .warning-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
    .warning-box svg{width:18px;height:18px;fill:#f97316;flex-shrink:0;margin-top:1px}
    .warning-text{font-size:11px;color:#7c2d12;line-height:1.5}
    .warning-text strong{display:block;font-size:12px;margin-bottom:3px;color:#92400e}
    .checklist{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
    .checklist li{display:flex;align-items:center;gap:8px;font-size:12px;color:#555}
    .checklist li svg{width:14px;height:14px;fill:#ef4444;flex-shrink:0}
    .bt-device{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #eae7f0;border-radius:8px;margin-bottom:6px}
    .bt-icon svg{width:18px;height:18px;fill:#9ca3af}
    .bt-device.paired .bt-icon svg{fill:#7c3aed}
    .bt-meta{flex:1}
    .bt-name{font-size:12px;font-weight:500;color:#222}
    .bt-detail{font-size:10px;color:#888;margin-top:2px}
  </style>
</head>
<body>

<div id="touch-cursor"></div>

<span class="version-badge">v1.9.16</span>

<script>
  var tc = document.getElementById('touch-cursor');
  var pinVal = '';
  var PIN_MAX = 4;

  document.addEventListener('mousemove', function(e) {
    tc.style.left = e.clientX + 'px';
    tc.style.top  = e.clientY + 'px';
  });
  document.addEventListener('mousedown', function() { tc.classList.add('tc-down'); });
  document.addEventListener('mouseup',   function() { tc.classList.remove('tc-down'); });
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length) {
      tc.style.left = e.touches[0].clientX + 'px';
      tc.style.top  = e.touches[0].clientY + 'px';
      tc.classList.add('tc-down');
    }
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length) {
      tc.style.left = e.touches[0].clientX + 'px';
      tc.style.top  = e.touches[0].clientY + 'px';
    }
  }, { passive: true });
  document.addEventListener('touchend', function() { tc.classList.remove('tc-down'); });

  var errorOverlay = document.getElementById('error-overlay');
  var screenArea   = document.getElementById('screen-area');
  var saL = 1.94, saT = 5.41, saW = 96.13, saH = 89.18;

  function applyScreenArea() {
    screenArea.style.left   = saL.toFixed(2) + '%';
    screenArea.style.top    = saT.toFixed(2) + '%';
    screenArea.style.width  = saW.toFixed(2) + '%';
    screenArea.style.height = saH.toFixed(2) + '%';
  }

  function pinKey(k) {
    if (pinVal.length >= PIN_MAX) return;
    pinVal += k;
    updatePinOverlay();
  }
  function updatePinOverlay() {
    for (var i = 0; i < PIN_MAX; i++) {
      var d = document.getElementById('pod' + i);
      if (d) d.classList.toggle('filled', i < pinVal.length);
    }
  }

  var sDrag = { on: false, el: null, startY: 0, startT: 0 };

  document.querySelectorAll('.scroll-content').forEach(function(el) {
    el.addEventListener('mousedown', function(e) {
      if (e.target.closest && e.target.closest('.flow-hotspot,.hs-handle')) return;
      if (document.body.classList.contains('debug')) return;
      e.preventDefault();
      sDrag.on = true; sDrag.el = el;
      sDrag.startY = e.clientY;
      sDrag.startT = parseFloat(el.style.top) || 0;
    });
    el.addEventListener('touchstart', function(e) {
      if (e.target.closest && e.target.closest('.flow-hotspot,.hs-handle')) return;
      sDrag.on = true; sDrag.el = el;
      sDrag.startY = e.touches[0].clientY;
      sDrag.startT = parseFloat(el.style.top) || 0;
    }, { passive: true });
  });

  document.addEventListener('touchmove', function(e) {
    if (!sDrag.on) return;
    e.preventDefault();
    var dy = e.touches[0].clientY - sDrag.startY;
    var newT = sDrag.startT + dy;
    var minT = screenArea.offsetHeight - sDrag.el.offsetHeight;
    sDrag.el.style.top = Math.max(minT, Math.min(0, newT)) + 'px';
  }, { passive: false });

  var hsDrag = { on: false, el: null, mode: '', sx: 0, sy: 0, oL: 0, oT: 0, oW: 0, oH: 0 };

  function getActiveScrollContent() {
    var al = screenArea.querySelector('.screen-layer.active');
    return al ? al.querySelector('.scroll-content') : null;
  }
  function getCoordBase() { return getActiveScrollContent() || screenArea; }

  var layerFileMap = {
    '1-1':'1.1.png','1':'1.png','2':'2.png',
    'apps':'apps.png','appstore':'appstore.png',
    'config':'config.png','update':'update.png','ota2':'ota.png',
    'candado1':'candado1.png','candado2':'candado2.png','candado3':'candado3.png'
  };

  function getDestLabel(el) {
    var oc = el.getAttribute('onclick') || '';
    var m = oc.match(/showLayer\(['"]([^'"]+)['"]\)/);
    if (m) return layerFileMap[m[1]] || m[1] + '.png';
    if (/resetFlow/.test(oc)) return '← inicio';
    if (/openError/.test(oc)) return 'error overlay';
    var pk = oc.match(/pinKey\(['"]([^'"]+)['"]\)/);
    if (pk) return 'PIN:' + pk[1];
    return '—';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var HS_SEL = '.flow-hotspot,.config-hotspot,.base-hotspot,.overlay-field';

  function refreshDebugPanel(activeEl) {
    var rows = document.getElementById('debug-panel-rows');
    if (!rows) return;
    rows.innerHTML = '';
    document.querySelectorAll(HS_SEL).forEach(function(el) {
      var lbl  = el.getAttribute('data-label') || '?';
      var dest = getDestLabel(el);
      var l = parseFloat(el.style.left)   || 0;
      var t = parseFloat(el.style.top)    || 0;
      var w = parseFloat(el.style.width)  || 0;
      var h = parseFloat(el.style.height) || 0;
      var coordStr = 'left:'+l.toFixed(1)+'%;top:'+t.toFixed(1)+'%;width:'+w.toFixed(1)+'%;height:'+h.toFixed(1)+'%';
      var row = document.createElement('div');
      row.className = 'dp-row' + (el === activeEl ? ' dp-active' : '');
      row.title = 'Clic para copiar';
      (function(coordStr, lbl, dest, row) {
        row.addEventListener('click', function() {
          var txt = lbl + ' → ' + dest + ': ' + coordStr;
          if (navigator.clipboard) { navigator.clipboard.writeText(txt); }
          else { var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta); }
          row.style.background = 'rgba(0,255,136,0.25)';
          setTimeout(function() { row.style.background = ''; }, 500);
        });
      })(coordStr, lbl, dest, row);
      var coordDisp = 'left:'+l.toFixed(1)+'%  top:'+t.toFixed(1)+'%  w:'+w.toFixed(1)+'%  h:'+h.toFixed(1)+'%';
      row.innerHTML =
        '<span class="dp-name">'+escHtml(lbl)+'</span>'+
        '<span class="dp-arrow">&#8594;</span>'+
        '<span class="dp-dest">'+escHtml(dest)+'</span>'+
        '<span class="dp-coords">'+coordDisp+'</span>';
      rows.appendChild(row);
    });
  }

  function copyAllDebug() {
    var lines = [];
    document.querySelectorAll(HS_SEL).forEach(function(el) {
      var lbl  = el.getAttribute('data-label') || '?';
      var dest = getDestLabel(el);
      var l = parseFloat(el.style.left)   || 0;
      var t = parseFloat(el.style.top)    || 0;
      var w = parseFloat(el.style.width)  || 0;
      var h = parseFloat(el.style.height) || 0;
      lines.push(lbl+' → '+dest+': left:'+l.toFixed(1)+'%;top:'+t.toFixed(1)+'%;width:'+w.toFixed(1)+'%;height:'+h.toFixed(1)+'%');
    });
    var btn = document.getElementById('debug-copy-btn');
    var txt = lines.join('\n');
    function done() {
      btn.textContent = '✓ Copiado';
      setTimeout(function() { btn.innerHTML = '&#128203; Copiar todo'; }, 1600);
    }
    if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(done); }
    else { var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done(); }
  }

  function hsApply(el, l, t, w, h) {
    l = Math.max(0, Math.min(98, l)); t = Math.max(0, Math.min(98, t));
    w = Math.max(2, Math.min(100, w)); h = Math.max(2, Math.min(100, h));
    el.style.left = l.toFixed(1)+'%'; el.style.top  = t.toFixed(1)+'%';
    el.style.width= w.toFixed(1)+'%'; el.style.height=h.toFixed(1)+'%';
    refreshDebugPanel(el);
  }

  function initDebugHotspots() {
    document.querySelectorAll(HS_SEL).forEach(function(el) {
      if (!el.style.left && el.offsetParent) {
        var par = el.offsetParent;
        el.style.left   = (el.offsetLeft   / par.offsetWidth  * 100).toFixed(1) + '%';
        el.style.top    = (el.offsetTop    / par.offsetHeight * 100).toFixed(1) + '%';
        el.style.width  = (el.offsetWidth  / par.offsetWidth  * 100).toFixed(1) + '%';
        el.style.height = (el.offsetHeight / par.offsetHeight * 100).toFixed(1) + '%';
      }
      if (el.querySelector('.hs-handle')) return;
      ['nw','ne','sw','se','n','s','w','e'].forEach(function(d) {
        var h = document.createElement('span');
        h.className = 'hs-handle ' + d; h.dataset.dir = d;
        el.appendChild(h);
      });
    });
    refreshDebugPanel(null);
  }

  function destroyDebugHotspots() {
    document.querySelectorAll('.hs-handle').forEach(function(h) { h.remove(); });
    var rows = document.getElementById('debug-panel-rows');
    if (rows) rows.innerHTML = '';
  }

  document.addEventListener('click', function(e) {
    if (!document.body.classList.contains('debug')) return;
    if (e.target.closest && e.target.closest(HS_SEL)) {
      e.preventDefault(); e.stopImmediatePropagation();
    }
  }, true);

  screenArea.addEventListener('mousemove', function(e) {
    if (!document.body.classList.contains('debug') || hsDrag.on) return;
    var base = getCoordBase(), rect = base.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    var y = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    var dh = document.getElementById('debug-hover');
    if (dh) dh.textContent = 'X:' + x + '% Y:' + y + '%';
  });

  screenArea.addEventListener('mousedown', function(e) {
    if (!document.body.classList.contains('debug')) return;
    var hEl  = e.target.closest ? e.target.closest('.hs-handle') : null;
    var hsEl = e.target.closest ? e.target.closest(HS_SEL) : null;
    if (hsEl) {
      e.preventDefault(); e.stopPropagation();
      hsDrag.on = true; hsDrag.el = hsEl;
      hsDrag.mode = hEl ? (hEl.dataset.dir || hEl.getAttribute('data-dir') || 'move') : 'move';
      hsDrag.sx = e.clientX; hsDrag.sy = e.clientY;
      hsDrag.oL = parseFloat(hsEl.style.left)   || 0;
      hsDrag.oT = parseFloat(hsEl.style.top)    || 0;
      hsDrag.oW = parseFloat(hsEl.style.width)  || 0;
      hsDrag.oH = parseFloat(hsEl.style.height) || 0;
      hsApply(hsEl, hsDrag.oL, hsDrag.oT, hsDrag.oW, hsDrag.oH);
      return;
    }
    var base = getCoordBase(), rect = base.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    var y = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    var dh = document.getElementById('debug-hover');
    if (dh) dh.textContent = 'X:' + x + '% Y:' + y + '%';
  }, true);

  document.addEventListener('mousemove', function(e) {
    if (hsDrag.on) {
      var sp = hsDrag.el.closest ? hsDrag.el.closest('.scroll-content') : null;
      var saRect = screenArea.getBoundingClientRect();
      var cW = saRect.width, cH = sp ? sp.offsetHeight : saRect.height;
      var dx = (e.clientX - hsDrag.sx) / cW * 100;
      var dy = (e.clientY - hsDrag.sy) / cH * 100;
      var m = hsDrag.mode;
      var l = hsDrag.oL, t = hsDrag.oT, w = hsDrag.oW, h = hsDrag.oH;
      if (m === 'move') { l += dx; t += dy; }
      else {
        if (m.indexOf('e') !== -1) w += dx;
        if (m.indexOf('w') !== -1) { l += dx; w -= dx; }
        if (m.indexOf('s') !== -1) h += dy;
        if (m.indexOf('n') !== -1) { t += dy; h -= dy; }
      }
      hsApply(hsDrag.el, l, t, w, h);
      return;
    }
    if (sDrag.on) {
      var dy2 = e.clientY - sDrag.startY;
      var newT = sDrag.startT + dy2;
      var minT = screenArea.offsetHeight - sDrag.el.offsetHeight;
      sDrag.el.style.top = Math.max(minT, Math.min(0, newT)) + 'px';
    }
  });

  document.addEventListener('mouseup', function() {
    if (hsDrag.on) { hsDrag.on = false; refreshDebugPanel(null); }
    sDrag.on = false;
  });

  function openError()  { errorOverlay.classList.add('open'); }
  function closeError() { errorOverlay.classList.remove('open'); }

  function showLayer(id) {
    closeError();
    document.querySelectorAll('.screen-layer').forEach(function(l) { l.classList.remove('active'); });
    document.querySelectorAll('.scroll-content').forEach(function(el) { el.style.top = '0'; });
    var el = document.getElementById('layer-' + id);
    if (el) el.classList.add('active');
    if (id === 'candado3') { pinVal = ''; updatePinOverlay(); }
  }

  function resetFlow() {
    closeError();
    document.querySelectorAll('.screen-layer').forEach(function(l) { l.classList.remove('active'); });
    document.querySelectorAll('.scroll-content').forEach(function(el) { el.style.top = '0'; });
    pinVal = '';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { resetFlow(); }
    if (e.key === 'd' || e.key === 'D') {
      document.body.classList.toggle('debug');
      if (document.body.classList.contains('debug')) { applyScreenArea(); initDebugHotspots(); }
      else destroyDebugHotspots();
      return;
    }
    if (!document.body.classList.contains('debug')) return;
    var arrows = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
    if (arrows.indexOf(e.key) === -1) return;
    e.preventDefault();
    var step = e.altKey ? 0.1 : 0.5;
    if (e.shiftKey) {
      if (e.key === 'ArrowLeft')  saW = Math.max(10,  saW - step);
      if (e.key === 'ArrowRight') saW = Math.min(100, saW + step);
      if (e.key === 'ArrowUp')    saH = Math.max(10,  saH - step);
      if (e.key === 'ArrowDown')  saH = Math.min(100, saH + step);
    } else {
      if (e.key === 'ArrowLeft')  saL = Math.max(0,  saL - step);
      if (e.key === 'ArrowRight') saL = Math.min(50, saL + step);
      if (e.key === 'ArrowUp')    saT = Math.max(0,  saT - step);
      if (e.key === 'ArrowDown')  saT = Math.min(50, saT + step);
    }
    applyScreenArea();
  });

  function svgEdit() { return '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>'; }
  function svgDel()  { return '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>'; }
  function svgWarn() { return '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>'; }
  function bars(n) {
    var h = '<div class="signal-bars">';
    for (var i = 1; i <= 4; i++) h += '<div class="bar' + (i<=n ? ' on' : '') + '" style="height:' + (i*4) + 'px"></div>';
    return h + '</div>';
